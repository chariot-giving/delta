name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build_and_test:
    runs-on: namespace-profile-ci
    strategy:
      matrix:
        # Run the 4 latest Postgres versions against the latest Go version:
        go-version:
          - "1.27.x"
        postgres-version: [14, 15, 16, 17]
        include:
          # Also run previous Go version against the latest Postgres version:
          - go-version: "1.26.x"
            postgres-version: 17
      fail-fast: false
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Configure cache
        uses: namespacelabs/nscloud-cache-action@58bf6e08898e88803c098e2b522668541cd3b2e3 # v1
        with:
          cache: go

      - name: Display Go version
        run: go version

      - name: Test
        working-directory: .
        run: go test -p 1 -race ./... -timeout 2m

  golangci:
    name: lint
    runs-on: namespace-profile-ci
    env:
      GOLANGCI_LINT_VERSION: v2.7.2
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true
          cache: false

      - name: Configure cache
        uses: namespacelabs/nscloud-cache-action@58bf6e08898e88803c098e2b522668541cd3b2e3 # v1
        with:
          path: |
            ~/.cache/golangci-lint
          cache: go

      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint needs to be run separately for every Go module, and
          # its GitHub Action doesn't provide any way to do that. Have it fetch
          # the golangci-lint binary, trick it into not running by sending only
          # `--help`, then run the full set of lints below. DO NOT run separate
          # modules as separate golangci-lint-action steps. Its post run caching
          # can be extremely slow, and that's amplified in a very painful way if
          # it needs to be run multiple times.
          args: --help
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          skip-cache: true

      - name: Run lint
        run: make lint

  migration_and_sqlc_verify:
    runs-on: namespace-profile-ci-small
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.28.0"

      - name: Verify sqlc generated code
        run: |
          echo "Make sure that all sqlc changes are checked in"
          make verify/sqlc
